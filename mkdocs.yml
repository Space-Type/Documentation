site_name: R-Type Documentation
site_description: Developer documentation of the Space-Type R-Type project
site_url: https://space-type.github.io/Documentation/
repo_name: Space-Type/R-Type
repo_url: https://github.com/Space-Type/R-Type
edit_uri: https://github.com/Space-Type/Documentation/edit/main/docs/

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - Systems:
      - Wrecks engine: systems/wrecks.md
      - Client: systems/client.md
      - Server: systems/server.md
  - Network protocol: protocol.md
  - Technical study: technical-study.md
  - Accessibility: accessibility.md
  - Contributing: contributing.md

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
